name: Build 3DSRadio

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PORTLIBS=$DEVKITPRO/portlibs/3ds
          # 3DS dev libraries are already installed in the image
          dkp-pacman -Sy --noconfirm 2>&1 | tail -3
          # FAAD2 is optional in devkitPro. Enable it when the portlib is
          # available, without making MP3/OGG-only images fail to build.
          if dkp-pacman -S --noconfirm 3ds-libfaad2; then
            echo "FAAD2 AAC backend: installed"
          else
            echo "FAAD2 portlib is not packaged; building FAAD2 2.11.2 from source"
            rm -rf /tmp/faad2-src /tmp/faad2-build
            mkdir -p /tmp/faad2-src
            curl -fsSL https://github.com/knik0/faad2/archive/refs/tags/2.11.2.tar.gz \
              | tar -xz --strip-components=1 -C /tmp/faad2-src
            cmake -S /tmp/faad2-src -B /tmp/faad2-build \
              -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$PORTLIBS" \
              -DBUILD_SHARED_LIBS=OFF \
              -DFAAD_BUNDLED_MODE=OFF \
              -DFAAD_BUILD_CLI=OFF \
              -DFAAD_APPLY_DRC=OFF
            # The upstream install script includes the DRM variant too, so
            # build all static decoder targets before installing.
            cmake --build /tmp/faad2-build --parallel
            cmake --install /tmp/faad2-build
            test -f "$PORTLIBS/include/neaacdec.h"
            test -f "$PORTLIBS/lib/libfaad.a"
            echo "FAAD2 AAC backend: built from pinned source"
          fi

      - name: Generate placeholder assets
        run: |
          # Generate banner.png (256x128 RGB gradient) and icon.png (48x48)
          python3 << 'EOF'
          import struct, zlib

          def make_png(w, h, pixels):
              def chunk(ctype, data):
                  c = ctype + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              header = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              raw = b''
              for row in pixels:
                  raw += b'\x00'
                  for rgb in row:
                      raw += struct.pack('BBB', rgb[0], rgb[1], rgb[2])
              return header + ihdr + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')

          # Banner
          bpix = []
          for y in range(128):
              row = []
              for x in range(256):
                  r = int(28 + (92 - 28) * y / 128)
                  g = int(28 + (158 - 28) * y / 128)
                  b = int(46 + (255 - 46) * y / 128)
                  row.append((r, g, b))
              bpix.append(row)
          with open('romfs/banner.png', 'wb') as f:
              f.write(make_png(256, 128, bpix))

          # Icon: a small radio mark matching the in-app brand.  Avoid a
          # placeholder letter/circle so the Home Menu icon is recognisable.
          ipix = []
          for y in range(48):
              row = []
              for x in range(48):
                  dx, dy = x - 24, y - 24
                  d2 = dx*dx + dy*dy
                  if d2 < 20*20:
                      row.append((14, 21, 30))
                  elif d2 < 22*22:
                      row.append((89, 208, 216))
                  else:
                      row.append((8, 10, 15))
              # Radio dial, antenna bars, and coral play marker.
              for bx, bh in [(15, 8), (19, 13), (23, 18)]:
                  for by in range(28 - bh, 28):
                      if 0 <= by < 48:
                          row[bx] = (89, 208, 216)
              for px in range(20, 29):
                  if abs(y - 24) <= (px - 20) * 2:
                      row[px] = (235, 91, 117)
              ipix.append(row)
          with open('romfs/icon.png', 'wb') as f:
              f.write(make_png(48, 48, ipix))

          # Silent WAV (100ms)
          with open('romfs/banner.wav', 'wb') as f:
              data_size = 800
              f.write(b'RIFF')
              f.write(struct.pack('<I', 36 + data_size))
              f.write(b'WAVEfmt ')
              f.write(struct.pack('<IHHIIHH', 16, 1, 1, 8000, 16000, 2, 16))
              f.write(b'data')
              f.write(struct.pack('<I', data_size))
              f.write(b'\x00\x00' * 400)

          print('Assets generated')
          EOF

      - name: Extract Chinese character list
        run: |
          python3 scripts/generate_charlist.py

      - name: Download CJK font and build BCFNT
        run: |
          # Noto Sans CJK SC Bold — static OTF at weight 700.
          # Downloaded directly (no fontTools/pip needed) from the
          # notofonts/noto-cjk GitHub repo. SIL Open Font License 1.1.
          #
          # Using static Bold instead of extracting from the variable font
          # because the devkitPro Docker image lacks pip, and dkp-pacman
          # mirrors are intermittently unreachable (403).
          echo "=== Downloading Noto Sans CJK SC Bold (static OTF) ==="
          FONT_URL="https://github.com/notofonts/noto-cjk/raw/main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Bold.otf"
          FONT_FILE="/tmp/NotoSansCJKsc-Bold.otf"
          curl -sSL -o "$FONT_FILE" "$FONT_URL"
          ls -la "$FONT_FILE"

          echo "=== Building BCFNT font (8px Bold, full basic CJK) ==="
          # An 8px source keeps the full basic CJK font within the 3DS
          # texture/FCRAM budget. C2D enlarges it per UI text level.
          echo "Charlist: $(wc -w < scripts/charlist.txt) codepoints"
          mkbcfnt -o romfs/chinese.bcfnt -s 8 \
            -w scripts/charlist.txt "$FONT_FILE"

          ls -la romfs/chinese.bcfnt
          echo "BCFNT font built successfully"

      - name: Download CA certificates
        run: |
          curl -sSL -o romfs/cacert.pem https://curl.se/ca/cacert.pem
          echo "CA certs: $(grep -c 'BEGIN CERTIFICATE' romfs/cacert.pem)"

      - name: Build 3DSX
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export CTRULIB=$DEVKITPRO/libctru
          export PORTLIBS=$DEVKITPRO/portlibs/3ds
          make -j$(nproc)
          ls -la *.3dsx *.elf

      - name: Run host logic tests
        run: |
          ./scripts/test_host.sh

      - name: Build CIA
        run: |
          set -eu
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export CTRULIB=$DEVKITPRO/libctru
          export PORTLIBS=$DEVKITPRO/portlibs/3ds
          make cia
          test -s 3DSRadio.cia
          ls -lh 3DSRadio.cia

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: 3DSRadio-3dsx
          path: |
            3DSRadio.3dsx
            3DSRadio.elf
          if-no-files-found: warn

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: 3DSRadio-cia
          path: 3DSRadio.cia
          if-no-files-found: error

      - name: Build Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in 3DSRadio.3dsx 3DSRadio.cia; do
            if [ -f "$f" ]; then
              sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
              echo "✅ **$(basename $f)**: $((sz/1024)) KB" >> $GITHUB_STEP_SUMMARY
            fi
          done

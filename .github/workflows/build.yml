name: Build 3DSRadio

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # 3DS dev libraries are already installed in the image
          dkp-pacman -Sy --noconfirm 2>&1 | tail -3

          # Try to install CIA tools via dkp-pacman
          echo "=== Installing CIA build tools ==="
          dkp-pacman -S --noconfirm bannertool makerom 2>&1 && \
            echo "CIA tools installed via dkp-pacman" || \
            echo "CIA tools not in repo, will skip CIA build"

          echo "=== Tool check ==="
          command -v bannertool && echo "bannertool: OK" || echo "bannertool: not found"
          command -v makerom && echo "makerom: OK" || echo "makerom: not found"

      - name: Generate placeholder assets
        run: |
          # Generate banner.png (256x128 RGB gradient) and icon.png (48x48)
          python3 << 'EOF'
          import struct, zlib

          def make_png(w, h, pixels):
              def chunk(ctype, data):
                  c = ctype + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              header = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              raw = b''
              for row in pixels:
                  raw += b'\x00'
                  for rgb in row:
                      raw += struct.pack('BBB', rgb[0], rgb[1], rgb[2])
              return header + ihdr + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')

          # Banner
          bpix = []
          for y in range(128):
              row = []
              for x in range(256):
                  r = int(28 + (92 - 28) * y / 128)
                  g = int(28 + (158 - 28) * y / 128)
                  b = int(46 + (255 - 46) * y / 128)
                  row.append((r, g, b))
              bpix.append(row)
          with open('romfs/banner.png', 'wb') as f:
              f.write(make_png(256, 128, bpix))

          # Icon (solid blue circle on black)
          ipix = []
          for y in range(48):
              row = []
              for x in range(48):
                  dx, dy = x - 24, y - 24
                  if dx*dx + dy*dy < 484:
                      row.append((92, 158, 255))
                  else:
                      row.append((0, 0, 0))
              ipix.append(row)
          with open('romfs/icon.png', 'wb') as f:
              f.write(make_png(48, 48, ipix))

          # Silent WAV (100ms)
          with open('romfs/banner.wav', 'wb') as f:
              data_size = 800
              f.write(b'RIFF')
              f.write(struct.pack('<I', 36 + data_size))
              f.write(b'WAVEfmt ')
              f.write(struct.pack('<IHHIIHH', 16, 1, 1, 8000, 16000, 2, 16))
              f.write(b'data')
              f.write(struct.pack('<I', data_size))
              f.write(b'\x00\x00' * 400)

          print('Assets generated')
          EOF

      - name: Extract Chinese character list
        run: |
          python3 << 'PYEOF'
          import os
          all_chars = set()
          for d in ['source', 'include']:
              if not os.path.isdir(d): continue
              for f in os.listdir(d):
                  if not f.endswith(('.c', '.h')): continue
                  with open(os.path.join(d, f), 'r', encoding='utf-8') as fh:
                      text = fh.read()
                  for ch in text:
                      cp = ord(ch)
                      if (0x4E00 <= cp <= 0x9FFF or
                          0x3400 <= cp <= 0x4DBF or
                          0xF900 <= cp <= 0xFAFF or
                          0x3000 <= cp <= 0x303F or
                          0xFF00 <= cp <= 0xFFEF or
                          0x2000 <= cp <= 0x206F or
                          0x0020 <= cp <= 0x007E):
                          all_chars.add(ch)
          # Add extras for station metadata
          for ch in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789·\xb7—…""''《》、。•°±×÷…—–　':
              all_chars.add(ch)
          os.makedirs('scripts', exist_ok=True)
          # mkbcfnt -w expects whitespace-separated hex codepoints like: 0x4E2D 0x56FD
          with open('scripts/charlist.txt', 'w', encoding='utf-8') as f:
              for ch in sorted(all_chars):
                  cp = ord(ch)
                  f.write(f'0x{cp:04X} ')
          print(f'Character list: {len(all_chars)} unique glyphs')
          PYEOF

      - name: Download CJK font and build BCFNT
        run: |
          echo "=== Downloading Noto Sans SC CJK font ==="
          # Noto Sans SC variable font (SIL Open Font License 1.1 - freely redistributable)
          # Note: static/ variants don't exist in the Google Fonts repo
          curl -sSL -o /tmp/NotoSansSC.ttf \
            "https://github.com/google/fonts/raw/main/ofl/notosanssc/NotoSansSC%5Bwght%5D.ttf"
          ls -la /tmp/NotoSansSC.ttf
          file /tmp/NotoSansSC.ttf

          echo "=== Building BCFNT font with mkbcfnt ==="
          echo "Charlist: $(wc -w < scripts/charlist.txt) codepoints"
          mkbcfnt -o romfs/chinese.bcfnt -s 16 \
            -w scripts/charlist.txt /tmp/NotoSansSC.ttf

          ls -la romfs/chinese.bcfnt
          echo "BCFNT font built successfully"

      - name: Download CA certificates
        run: |
          curl -sSL -o romfs/cacert.pem https://curl.se/ca/cacert.pem
          echo "CA certs: $(grep -c 'BEGIN CERTIFICATE' romfs/cacert.pem)"

      - name: Build 3DSX
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export CTRULIB=$DEVKITPRO/libctru
          export PORTLIBS=$DEVKITPRO/portlibs/arm
          make -j$(nproc)
          ls -la *.3dsx *.elf

      - name: Build CIA (if tools available)
        run: |
          if command -v bannertool &>/dev/null && command -v makerom &>/dev/null; then
            export DEVKITPRO=/opt/devkitpro
            export DEVKITARM=$DEVKITPRO/devkitARM
            export CTRULIB=$DEVKITPRO/libctru
            export PORTLIBS=$DEVKITPRO/portlibs/arm
            make cia 2>&1
            ls -la *.cia 2>/dev/null && echo "CIA built successfully" || echo "No CIA produced"
          else
            echo "Skipping CIA build (bannertool/makerom not available)"
          fi

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: 3DSRadio-3dsx
          path: |
            3DSRadio.3dsx
            3DSRadio.elf
          if-no-files-found: warn

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: 3DSRadio-cia
          path: 3DSRadio.cia
          if-no-files-found: ignore

      - name: Build Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in 3DSRadio.3dsx 3DSRadio.cia; do
            if [ -f "$f" ]; then
              sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
              echo "✅ **$(basename $f)**: $((sz/1024)) KB" >> $GITHUB_STEP_SUMMARY
            fi
          done

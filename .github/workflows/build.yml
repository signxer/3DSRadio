name: Build 3DSRadio

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # Install base system build tools (Arch Linux repos)
          pacman -Sy --noconfirm 2>&1 | tail -3
          pacman -S --noconfirm git make gcc python 2>&1 | tail -5 || true

          # Install 3DS dev libraries (devkitPro repos)
          dkp-pacman -Sy --noconfirm 2>&1 | tail -3
          dkp-pacman -S --noconfirm \
            3ds-libcurl 3ds-mbedtls 3ds-libpng 3ds-libjpeg-turbo 2>&1 | tail -5 || true

          # Build bannertool from source
          if ! command -v bannertool &>/dev/null; then
            echo "Building bannertool..."
            git config --global advice.detachedHead false
            git clone --depth 1 https://github.com/devkitPro/bannertool.git /tmp/bannertool
            cd /tmp/bannertool && make -j$(nproc)
            cp bannertool /usr/local/bin/
            echo "bannertool built"
          fi

          # Build makerom from source
          if ! command -v makerom &>/dev/null; then
            echo "Building makerom..."
            git clone --depth 1 https://github.com/devkitPro/makerom.git /tmp/makerom
            cd /tmp/makerom && make -j$(nproc)
            cp makerom /usr/local/bin/
            echo "makerom built"
          fi

          which bannertool 2>/dev/null && echo "bannertool OK" || echo "bannertool not available"
          which makerom 2>/dev/null && echo "makerom OK" || echo "makerom not available"

      - name: Generate placeholder assets
        run: |
          # Generate banner.png (256x128 RGB gradient) and icon.png (48x48)
          python3 << 'EOF'
          import struct, zlib

          def make_png(w, h, pixels):
              def chunk(ctype, data):
                  c = ctype + data
                  return struct.pack('>I', len(data)) + c + struct.pack('>I', zlib.crc32(c) & 0xffffffff)
              header = b'\x89PNG\r\n\x1a\n'
              ihdr = chunk(b'IHDR', struct.pack('>IIBBBBB', w, h, 8, 2, 0, 0, 0))
              raw = b''
              for row in pixels:
                  raw += b'\x00'
                  for rgb in row:
                      raw += struct.pack('BBB', rgb[0], rgb[1], rgb[2])
              return header + ihdr + chunk(b'IDAT', zlib.compress(raw)) + chunk(b'IEND', b'')

          # Banner
          bpix = []
          for y in range(128):
              row = []
              for x in range(256):
                  r = int(28 + (92 - 28) * y / 128)
                  g = int(28 + (158 - 28) * y / 128)
                  b = int(46 + (255 - 46) * y / 128)
                  row.append((r, g, b))
              bpix.append(row)
          with open('romfs/banner.png', 'wb') as f:
              f.write(make_png(256, 128, bpix))

          # Icon (solid blue circle on black)
          ipix = []
          for y in range(48):
              row = []
              for x in range(48):
                  dx, dy = x - 24, y - 24
                  if dx*dx + dy*dy < 484:
                      row.append((92, 158, 255))
                  else:
                      row.append((0, 0, 0))
              ipix.append(row)
          with open('romfs/icon.png', 'wb') as f:
              f.write(make_png(48, 48, ipix))

          # Silent WAV (100ms)
          with open('romfs/banner.wav', 'wb') as f:
              data_size = 800
              f.write(b'RIFF')
              f.write(struct.pack('<I', 36 + data_size))
              f.write(b'WAVEfmt ')
              f.write(struct.pack('<IHHIIHH', 16, 1, 1, 8000, 16000, 2, 16))
              f.write(b'data')
              f.write(struct.pack('<I', data_size))
              f.write(b'\x00\x00' * 400)

          print('Assets generated')
          EOF

      - name: Download CA certificates
        run: |
          curl -sSL -o romfs/cacert.pem https://curl.se/ca/cacert.pem
          echo "CA certs: $(grep -c 'BEGIN CERTIFICATE' romfs/cacert.pem)"

      - name: Build 3DSX
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export CTRULIB=$DEVKITPRO/libctru
          export PORTLIBS=$DEVKITPRO/portlibs/arm
          make -j$(nproc)
          ls -la *.3dsx *.elf

      - name: Build CIA
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export CTRULIB=$DEVKITPRO/libctru
          export PORTLIBS=$DEVKITPRO/portlibs/arm
          export PATH="/usr/local/bin:$PATH"
          make cia 2>&1
          ls -la *.cia 2>/dev/null && echo "CIA built successfully" || echo "No CIA produced"

      - name: Upload 3DSX
        uses: actions/upload-artifact@v4
        with:
          name: 3DSRadio-3dsx
          path: |
            3DSRadio.3dsx
            3DSRadio.elf
          if-no-files-found: warn

      - name: Upload CIA
        uses: actions/upload-artifact@v4
        with:
          name: 3DSRadio-cia
          path: 3DSRadio.cia
          if-no-files-found: ignore

      - name: Build Summary
        run: |
          echo "## Build Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in 3DSRadio.3dsx 3DSRadio.cia; do
            if [ -f "$f" ]; then
              sz=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f" 2>/dev/null)
              echo "✅ **$(basename $f)**: $((sz/1024)) KB" >> $GITHUB_STEP_SUMMARY
            fi
          done
